<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>متابعة مديونيات — فرع الوفاء</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
<style>
/* ══════════════════════════════════════════
   NEUMORPHISM DESIGN SYSTEM — DARK MODE
══════════════════════════════════════════ */
:root {
  --bg:          #1e2330;
  --surface:     #1e2330;
  --surface-2:   #232a3b;
  --sh-dark:     #131720;
  --sh-light:    #293148;
  --text:        #cdd6f4;
  --text-muted:  #6c7a99;
  --accent:      #008080;
  --accent-glow: #00b3b3;
  --success:     #00A63D;
  --export:      #FE9900;
  --danger:      #FF2157;
  --val-color:   #4ec9b0;
  --gold:        #f4a261;
  --yellow:      #f39c12;
  --border:      #2d3748;
  --td-border:   #2a3044;
  --th-bg:       #1a2030;
  --radius:      16px;
  --nm-raised:    6px 6px 14px var(--sh-dark), -6px -6px 14px var(--sh-light);
  --nm-inset:     inset 4px 4px 10px var(--sh-dark), inset -4px -4px 10px var(--sh-light);
  --nm-raised-lg: 12px 12px 28px var(--sh-dark), -12px -12px 28px var(--sh-light);
  --nm-pressed:   inset 3px 3px 8px var(--sh-dark), inset -3px -3px 8px var(--sh-light);
}

*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Cairo',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}

::-webkit-scrollbar{width:6px;}
::-webkit-scrollbar-track{background:var(--surface);}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:6px;}
::-webkit-scrollbar-thumb:hover{background:var(--accent);}

/* ── HEADER ── */
header{
  background:linear-gradient(135deg,#006666,#023e8a);
  padding:16px 28px;display:flex;align-items:center;justify-content:space-between;
  box-shadow:0 4px 24px rgba(0,128,128,.35);
  position:sticky;top:0;z-index:100;
}
.header-title{font-size:1.35rem;font-weight:900;letter-spacing:.5px;color:#fff;}
.header-date{font-size:.8rem;color:rgba(255,255,255,.7);margin-top:2px;}
.header-icon{font-size:1.8rem;filter:drop-shadow(0 2px 6px rgba(0,180,216,.4));}

/* ── SEARCH BAR ── */
.search-bar{
  background:var(--surface-2);
  border-bottom:1px solid var(--border);
  padding:12px 24px;
  position:sticky;top:65px;z-index:98;
}
.search-wrap{max-width:1100px;margin:0 auto;position:relative;}
.search-wrap input{
  width:100%;
  background:var(--surface);
  box-shadow:var(--nm-inset);
  border:none;
  border-radius:999px;
  padding:11px 18px 11px 44px;
  color:var(--text);
  font-family:'Cairo',sans-serif;
  font-size:.92rem;
  outline:none;
  transition:box-shadow .2s;
  direction:rtl;
}
.search-wrap input:focus{box-shadow:var(--nm-pressed);}
.search-icon{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--text-muted);font-size:1.05rem;}
#search-results{
  position:absolute;top:calc(100% + 6px);right:0;left:0;
  background:var(--surface);
  box-shadow:var(--nm-raised-lg);
  border-radius:14px;z-index:200;max-height:300px;overflow-y:auto;display:none;
}
.search-item{padding:13px 18px;cursor:pointer;border-bottom:1px solid var(--td-border);display:flex;justify-content:space-between;align-items:center;transition:background .15s;}
.search-item:last-child{border-bottom:none;}
.search-item:hover{background:var(--surface-2);}
.search-item-name{font-weight:700;font-size:.92rem;}
.search-item-meta{font-size:.78rem;color:var(--text-muted);}

/* ── TABS ── */
.tabs-bar{
  display:flex;
  background:var(--surface-2);
  border-bottom:1px solid var(--border);
  position:sticky;top:117px;z-index:97;
  overflow-x:auto;
  padding:0 24px;
}
.tab-btn{
  flex:1;min-width:90px;padding:14px 8px;
  background:none;border:none;
  color:var(--text-muted);
  font-family:'Cairo',sans-serif;font-size:.85rem;font-weight:700;
  cursor:pointer;position:relative;transition:color .2s;
  display:flex;align-items:center;justify-content:center;gap:5px;
  white-space:nowrap;
}
.tab-btn.active{color:var(--accent-glow);}
.tab-btn.active::after{
  content:'';position:absolute;bottom:0;left:0;right:0;height:3px;
  background:var(--accent-glow);border-radius:3px 3px 0 0;
  box-shadow:0 0 8px rgba(0,179,179,.5);
}
.badge{
  background:var(--danger);color:#fff;border-radius:999px;
  font-size:.68rem;padding:1px 6px;font-weight:700;
  min-width:18px;text-align:center;display:none;
}
.badge.show{display:inline-block;}

/* ── PANELS ── */
.panel{display:none;padding:28px 32px;max-width:1200px;margin:0 auto;}
.panel.active{display:block;}

/* ── CARD ── */
.card{
  background:var(--surface);
  box-shadow:var(--nm-raised);
  border-radius:var(--radius);
  padding:24px;margin-bottom:20px;
}
.card-title{font-size:1.05rem;font-weight:900;color:var(--accent-glow);margin-bottom:18px;display:flex;align-items:center;gap:8px;letter-spacing:.3px;}

/* ── FORM ── */
.form-group{margin-bottom:16px;}
label{display:block;font-size:.78rem;color:var(--text-muted);margin-bottom:7px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;}
input[type=text],input[type=date],input[type=number],select{
  width:100%;
  background:var(--surface);
  box-shadow:var(--nm-inset);
  border:none;
  border-radius:10px;
  padding:13px 16px;
  color:var(--text);
  font-family:'Cairo',sans-serif;font-size:.95rem;
  outline:none;transition:box-shadow .2s;direction:rtl;
}
input[type=text]:focus,input[type=date]:focus,input[type=number]:focus,select:focus{box-shadow:var(--nm-pressed);}
input[type=number]{direction:ltr;text-align:right;}
select option{background:var(--surface-2);}

/* ── BUTTONS ── */
.btn{
  width:100%;padding:14px;border:none;
  border-radius:12px;
  font-family:'Cairo',sans-serif;font-size:1rem;font-weight:700;
  cursor:pointer;transition:box-shadow .2s,transform .1s;
  box-shadow:var(--nm-raised);
}
.btn:active{transform:scale(.98);box-shadow:var(--nm-inset);}
.btn-primary{background:linear-gradient(135deg,#006666,#004d4d);color:#fff;box-shadow:6px 6px 14px var(--sh-dark),-6px -6px 14px var(--sh-light),0 0 14px rgba(0,128,128,.2);}
.btn-primary:hover{box-shadow:6px 6px 18px var(--sh-dark),-6px -6px 18px var(--sh-light),0 0 20px rgba(0,179,179,.3);}
.btn-gold{background:linear-gradient(135deg,#f4a261,#e76f51);color:#fff;box-shadow:6px 6px 14px var(--sh-dark),-6px -6px 14px var(--sh-light);}
.btn-gold:hover{box-shadow:6px 6px 18px var(--sh-dark),-6px -6px 18px var(--sh-light),0 0 16px rgba(244,162,97,.3);}
.btn-green{background:linear-gradient(135deg,#00A63D,#007a2d);color:#fff;box-shadow:6px 6px 14px var(--sh-dark),-6px -6px 14px var(--sh-light);}
.btn-green:hover{box-shadow:6px 6px 18px var(--sh-dark),-6px -6px 18px var(--sh-light),0 0 16px rgba(0,166,61,.3);}
.btn-sm{width:auto;padding:8px 16px;font-size:.82rem;border-radius:8px;}
.btn-outline{background:var(--surface);box-shadow:var(--nm-raised);color:var(--text-muted);}
.btn-outline:hover{color:var(--accent-glow);box-shadow:var(--nm-raised),0 0 10px rgba(0,179,179,.15);}
.btn-danger{background:linear-gradient(135deg,#FF2157,#cc1040);color:#fff;box-shadow:6px 6px 14px var(--sh-dark),-6px -6px 14px var(--sh-light);}

/* ── TABLE ── */
.table-wrap{
  background:var(--surface);
  border-radius:14px;
  box-shadow:var(--nm-raised);
  overflow-x:auto;
}
table{width:100%;border-collapse:collapse;font-size:.87rem;}
th{
  background:var(--th-bg);
  padding:12px 14px;text-align:right;
  color:var(--text-muted);font-weight:700;
  border-bottom:1px solid var(--td-border);
  white-space:nowrap;font-size:.78rem;text-transform:uppercase;letter-spacing:.4px;
}
td{padding:11px 14px;border-bottom:1px solid var(--td-border);vertical-align:middle;}
tr:last-child td{border-bottom:none;}
tbody tr:hover td{background:rgba(0,128,128,.06);}

/* ── STATUS BADGES ── */
.status{display:inline-block;padding:4px 12px;border-radius:999px;font-size:.75rem;font-weight:700;white-space:nowrap;}
.status-paid{background:rgba(0,166,61,.15);color:#00A63D;border:1px solid rgba(0,166,61,.3);}
.status-partial{background:rgba(243,156,18,.15);color:var(--yellow);border:1px solid rgba(243,156,18,.3);}
.status-unpaid{background:rgba(255,33,87,.15);color:var(--danger);border:1px solid rgba(255,33,87,.3);}

/* ── STATS GRID ── */
.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:20px;}
.stat-card{
  background:var(--surface);
  box-shadow:var(--nm-raised);
  border-radius:14px;
  padding:18px;text-align:center;
  cursor:pointer;transition:box-shadow .2s;
}
.stat-card:hover{box-shadow:var(--nm-raised),0 0 12px rgba(0,179,179,.15);}
.stat-value{font-size:1.6rem;font-weight:900;color:var(--val-color);}
.stat-label{font-size:.72rem;color:var(--text-muted);margin-top:4px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;}

/* ── REPORT PANEL ── */
.report-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:10px;}
.today-label{
  font-size:.82rem;font-weight:700;
  background:rgba(0,128,128,.15);
  border:1px solid rgba(0,179,179,.3);
  color:var(--accent-glow);
  padding:6px 16px;border-radius:999px;
}
#report-snap{
  background:var(--surface);
  box-shadow:var(--nm-raised);
  border-radius:var(--radius);
  padding:20px;
}
.snap-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--td-border);}
.snap-title{font-size:1.05rem;font-weight:900;color:var(--accent-glow);}
.snap-subtitle{font-size:.78rem;color:var(--text-muted);}

/* ── COLLECTION BALANCE ── */
.client-invoices{
  background:var(--surface);
  box-shadow:var(--nm-inset);
  border-radius:10px;padding:14px;margin-bottom:12px;
}
.client-row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--td-border);font-size:.85rem;}
.client-row:last-child{border-bottom:none;}

/* ── EMPTY STATE ── */
.empty{text-align:center;padding:48px 20px;color:var(--text-muted);}
.empty-icon{font-size:3.5rem;margin-bottom:12px;}

/* ── TOAST ── */
#toast{
  position:fixed;bottom:28px;left:50%;
  transform:translateX(-50%) translateY(80px);
  background:var(--surface);
  box-shadow:var(--nm-raised-lg);
  color:var(--text);
  padding:13px 28px;border-radius:999px;
  font-size:.92rem;font-weight:700;
  z-index:9999;transition:transform .3s;white-space:nowrap;
}
#toast.show{transform:translateX(-50%) translateY(0);}
#toast.success{color:var(--success);}
#toast.error{color:var(--danger);}

/* ── CLIENT MODAL ── */
.modal-overlay{
  position:fixed;inset:0;
  background:rgba(13,16,23,.82);
  backdrop-filter:blur(4px);
  z-index:500;display:none;
  align-items:flex-start;justify-content:center;
  padding:20px;overflow-y:auto;
}
.modal-overlay.open{display:flex;}
.modal{
  background:var(--surface);
  box-shadow:var(--nm-raised-lg);
  border-radius:20px;
  padding:28px;width:100%;max-width:1000px;margin-top:12px;
}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;}
.modal-title{font-size:1.2rem;font-weight:900;color:var(--accent-glow);}
.close-btn{
  background:var(--surface);
  box-shadow:var(--nm-raised);
  border:none;color:var(--text-muted);
  font-size:1.1rem;cursor:pointer;
  width:38px;height:38px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  transition:box-shadow .2s,color .2s;
}
.close-btn:hover{color:var(--danger);box-shadow:var(--nm-inset);}

/* ── QUICK VIEW PANEL ── */
.quick-panel{
  background:var(--surface);
  box-shadow:var(--nm-inset);
  border-radius:var(--radius);
  padding:18px;margin-bottom:20px;display:none;
}
.quick-panel.open{display:block;}
.quick-panel-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
.quick-panel-title{font-weight:900;font-size:1rem;color:var(--accent-glow);}

/* ── CHECKBOX FILTER ── */
.check-filters{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px;}
.check-label{
  display:flex;align-items:center;gap:6px;cursor:pointer;
  font-size:.85rem;font-weight:700;padding:8px 16px;
  border-radius:10px;
  background:var(--surface);
  box-shadow:var(--nm-raised);
  transition:all .2s;user-select:none;color:var(--text-muted);
}
.check-label input[type=checkbox]{display:none;}
.check-label.checked-all{box-shadow:var(--nm-inset);color:var(--accent-glow);}
.check-label.checked-unpaid{box-shadow:var(--nm-inset);color:var(--danger);}
.check-label.checked-partial{box-shadow:var(--nm-inset);color:var(--yellow);}
.check-label.checked-paid{box-shadow:var(--nm-inset);color:var(--success);}

/* ── COLLECTION DATES in modal ── */
.col-dates{font-size:.72rem;color:var(--text-muted);margin-top:3px;}

/* ── POSTPONE POPUP ── */
.postpone-overlay{
  position:fixed;inset:0;
  background:rgba(13,16,23,.75);
  backdrop-filter:blur(4px);
  z-index:600;display:none;
  align-items:center;justify-content:center;padding:20px;
}
.postpone-overlay.open{display:flex;}
.postpone-box{
  background:var(--surface);
  box-shadow:var(--nm-raised-lg);
  border-radius:20px;
  padding:26px;width:100%;max-width:380px;
}
.postpone-title{font-weight:900;font-size:1.05rem;color:var(--gold);margin-bottom:6px;}
.postpone-client{font-size:.82rem;color:var(--text-muted);margin-bottom:18px;}
.postpone-tabs{display:flex;gap:10px;margin-bottom:16px;}
.p-tab{
  flex:1;padding:10px;
  background:var(--surface);
  box-shadow:var(--nm-raised);
  border:none;border-radius:10px;
  color:var(--text-muted);
  font-family:'Cairo',sans-serif;font-size:.85rem;font-weight:700;
  cursor:pointer;transition:all .2s;text-align:center;
}
.p-tab.active{box-shadow:var(--nm-inset);color:var(--gold);}
.p-section{display:none;}.p-section.open{display:block;}

/* ── OVERDUE ALERT ── */
.overdue-alert{
  background:rgba(255,33,87,.08);
  box-shadow:inset 2px 2px 6px rgba(255,33,87,.1);
  border-radius:10px;padding:12px 16px;margin-bottom:16px;
  display:flex;align-items:center;gap:10px;font-size:.88rem;color:#ff6b6b;
}

/* ── DATE INPUT in report bar ── */
.report-date-input{
  background:var(--surface);
  box-shadow:var(--nm-inset);
  border:none;border-radius:10px;
  padding:9px 12px;font-size:.82rem;
  color:var(--text);font-family:'Cairo',sans-serif;
  outline:none;
}
.report-date-input:focus{box-shadow:var(--nm-pressed);}

/* ── INFO BOXES ── */
.info-box{
  background:rgba(0,128,128,.1);
  box-shadow:inset 2px 2px 8px rgba(0,128,128,.15);
  border-radius:10px;padding:12px 16px;
  margin-bottom:14px;font-size:.82rem;color:var(--text-muted);
}

/* ── DAY QUICK STATS ── */
.day-stat-row{display:flex;gap:12px;margin-bottom:14px;flex-wrap:wrap;}
.day-stat{
  flex:1;min-width:120px;
  background:var(--surface);
  box-shadow:var(--nm-raised);
  border-radius:12px;padding:12px 16px;text-align:center;
}
.day-stat-val{font-weight:900;font-size:1.1rem;}
.day-stat-lbl{font-size:.73rem;color:var(--text-muted);margin-top:2px;}

@media(max-width:900px){
  .panel{padding:18px 16px;max-width:100%;}
  .stats-grid{grid-template-columns:1fr 1fr;}
  .tabs-bar{padding:0 8px;}
}
@media(max-width:600px){
  header{padding:12px 16px;}
  .stats-grid{grid-template-columns:1fr 1fr;}
  .tab-btn{font-size:.73rem;min-width:75px;}
  .panel{padding:14px 12px;}
}
</style>
</head>
<body>

<header>
  <div>
    <div class="header-title">💼 متابعة مديونيات — فرع الوفاء</div>
    <div class="header-date" id="hdr-date"></div>
  </div>
  <div class="header-icon">🏦</div>
</header>

<!-- SEARCH -->
<div class="search-bar">
  <div class="search-wrap">
    <input type="text" id="global-search" placeholder="ابحث عن عميل بالاسم..." oninput="doSearch()" onblur="hideSearchDelay()">
    <span class="search-icon">🔍</span>
    <div id="search-results"></div>
  </div>
</div>

<!-- TABS -->
<div class="tabs-bar">
  <button class="tab-btn active" onclick="switchTab('invoices',this)">🧾 تسجيل الفواتير</button>
  <button class="tab-btn" onclick="switchTab('collection',this)">💰 تسجيل التحصيل</button>
  <button class="tab-btn" onclick="switchTab('report',this)">📋 تحصيلات اليوم <span class="badge" id="report-badge"></span></button>
  <button class="tab-btn" onclick="switchTab('all',this)">📂 كل الفواتير</button>
</div>

<!-- ══ INVOICES ══ -->
<div class="panel active" id="panel-invoices">
  <div class="card">
    <div class="card-title">➕ تسجيل فاتورة جديدة</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;">
      <div>
        <div class="form-group">
          <label>اسم العميل</label>
          <input type="text" id="inv-client" placeholder="أدخل اسم العميل..." list="clients-list">
          <datalist id="clients-list"></datalist>
        </div>
        <div class="form-group"><label>تاريخ الفاتورة</label><input type="date" id="inv-date"></div>
      </div>
      <div>
        <div class="form-group"><label>مبلغ الفاتورة (جنيه)</label><input type="number" id="inv-amount" placeholder="0.00" min="0" step="0.01"></div>
        <div class="form-group"><label>رقم الفاتورة (اختياري)</label><input type="text" id="inv-number" placeholder="مثل: INV-001"></div>
      </div>
    </div>
    <button class="btn btn-primary" onclick="addInvoice()">💾 حفظ الفاتورة</button>
  </div>
  <!-- Stats — clickable -->
  <div class="stats-grid" id="inv-stats"></div>
  <!-- Quick panels -->
  <div class="quick-panel" id="qp-collected">
    <div class="quick-panel-header">
      <span class="quick-panel-title">💵 تحصيلات اليوم</span>
      <button class="btn btn-sm btn-outline" onclick="closeQP()">✕</button>
    </div>
    <div id="qp-collected-body"></div>
  </div>
  <div class="quick-panel" id="qp-remaining">
    <div class="quick-panel-header">
      <span class="quick-panel-title">📋 الفواتير غير المسددة / الجزئية</span>
      <button class="btn btn-sm btn-outline" onclick="closeQP()">✕</button>
    </div>
    <div id="qp-remaining-body"></div>
  </div>
</div>

<!-- ══ COLLECTION ══ -->
<div class="panel" id="panel-collection">
  <div class="card">
    <div class="card-title">💵 تسجيل تحصيل</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;">
      <div>
        <div class="form-group">
          <label>اسم العميل</label>
          <select id="col-client" onchange="showClientBalance()"><option value="">-- اختر العميل --</option></select>
        </div>
        <div class="form-group"><label>المبلغ المحصل (جنيه)</label><input type="number" id="col-amount" placeholder="0.00" min="0" step="0.01"></div>
        <div class="form-group"><label>تاريخ التحصيل</label><input type="date" id="col-date"></div>
        <button class="btn btn-gold" onclick="applyCollection()">✅ تطبيق التحصيل (FIFO)</button>
      </div>
      <div>
        <div id="client-balance-info" style="display:none;"></div>
      </div>
    </div>
  </div>
</div>

<!-- ══ DAILY REPORT ══ -->
<div class="panel" id="panel-report">
  <div class="report-header">
    <span class="today-label" id="report-today-lbl"></span>
    <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">
      <input type="date" id="report-date-filter" class="report-date-input" onchange="renderReport()">
      <button class="btn btn-sm btn-outline" onclick="resetReportDate()">📅 اليوم</button>
      <button class="btn btn-sm btn-outline" onclick="captureReport()">📸 صورة</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" defer></script>
<script>
// ═══ DATA ═══
const SK='wafa_invoices_v1';
const CK='wafa_credits_v1';
function load(){try{return JSON.parse(localStorage.getItem(SK))||[];}catch{return[];}}
function save(d){localStorage.setItem(SK,JSON.stringify(d));}
function loadCredits(){try{return JSON.parse(localStorage.getItem(CK))||{};}catch{return{};}}
function saveCredits(c){localStorage.setItem(CK,JSON.stringify(c));}
function getCredit(client){return loadCredits()[client]||0;}
function addCredit(client,amount,date){
  const c=loadCredits();
  if(!c[client])c[client]=0;
  c[client]=+(c[client]+amount).toFixed(2);
  const logKey=CK+'_log';
  const log=JSON.parse(localStorage.getItem(logKey)||'[]');
  log.push({client,amount,date,type:'credit'});
  localStorage.setItem(logKey,JSON.stringify(log));
  saveCredits(c);
}
function useCredit(client,amount){
  const c=loadCredits();
  c[client]=+Math.max(0,(c[client]||0)-amount).toFixed(2);
  saveCredits(c);
}
function nextId(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}

// ═══ HELPERS ═══
function fmt(n){return Number(n||0).toLocaleString('ar-EG',{minimumFractionDigits:2,maximumFractionDigits:2});}
function fmtDate(d){if(!d)return'';const[y,m,day]=d.split('-');return`${day}/${m}/${y}`;}
function todayStr(){return new Date().toISOString().slice(0,10);}
function addDays(ds,n){
  const [y,m,d]=ds.split('-').map(Number);
  const date=new Date(y,m-1,d+n);
  return date.getFullYear()+'-'+String(date.getMonth()+1).padStart(2,'0')+'-'+String(date.getDate()).padStart(2,'0');
}
function calcDueDate(invDate, offset){
  const [iy,im,id]=invDate.split('-').map(Number);
  const rawDate=new Date(iy,im-1,id+7+(offset||0));
  const rawMonth=rawDate.getMonth()+1;
  let resDate=rawDate;
  if(rawMonth!==im){
    resDate=new Date(iy,im,0);
  }
  if(resDate.getDay()===5){
    resDate=new Date(resDate.getFullYear(),resDate.getMonth(),resDate.getDate()-1);
  }
  return resDate.getFullYear()+'-'+String(resDate.getMonth()+1).padStart(2,'0')+'-'+String(resDate.getDate()).padStart(2,'0');
}
function statusLabel(inv){const p=inv.paid||0;if(p<=0)return['unpaid','غير مسددة'];if(p>=inv.amount)return['paid','مسددة'];return['partial','مسددة جزئيا ('+fmt(p)+')'];}
function isOverdue(inv){return calcDueDate(inv.date,inv.dueOffset)<todayStr()&&(inv.paid||0)<inv.amount;}
function showToast(msg,type='success'){const t=document.getElementById('toast');t.textContent=msg;t.className=`show ${type}`;setTimeout(()=>{t.className='';},2800);}

// ═══ TABS ═══
function switchTab(name,btn){
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('panel-'+name).classList.add('active');
  btn.classList.add('active');
  if(name==='report'){document.getElementById('report-date-filter').value=document.getElementById('report-date-filter').value||todayStr();renderReport();}
  if(name==='all')renderAll();
  if(name==='invoices'){renderInvStats();closeQP();}
  if(name==='collection')populateClientSelect();
}

// ═══ SEARCH ═══
let _st;
function doSearch(){clearTimeout(_st);_st=setTimeout(_doSearch,150);}
function _doSearch(){
  const q=document.getElementById('global-search').value.trim();
  const box=document.getElementById('search-results');
  if(!q){box.style.display='none';return;}
  const map={};
  load().forEach(inv=>{
    if(inv.client.includes(q)){
      if(!map[inv.client])map[inv.client]={count:0,due:0,overdue:false};
      map[inv.client].count++;map[inv.client].due+=Math.max(0,inv.amount-(inv.paid||0));
      if(isOverdue(inv))map[inv.client].overdue=true;
    }
  });
  const names=Object.keys(map);
  if(!names.length){box.innerHTML='<div class="search-item"><span style="color:var(--text-muted)">لا توجد نتائج</span></div>';box.style.display='block';return;}
  box.innerHTML=names.map(n=>`
    <div class="search-item" onmousedown="openClientModal('${esc(n)}')">
      <div>
        <div class="search-item-name">${n} ${map[n].overdue?'<span style="color:var(--danger)">⚠️</span>':''}</div>
        <div class="search-item-meta">${map[n].count} فاتورة — متبقي: ${fmt(map[n].due)} جنيه</div>
      </div>
      <span style="color:var(--accent-glow);font-size:.8rem">عرض ←</span>
    </div>`).join('');
  box.style.display='block';
}
function hideSearchDelay(){setTimeout(()=>{document.getElementById('search-results').style.display='none';},200);}
function esc(s){return s.replace(/\\/g,'\\\\').replace(/'/g,"\\'");}

// ═══ CLIENT MODAL ═══
let modalClient='';
function openClientModal(name){
  modalClient=name;
  document.getElementById('global-search').value='';
  document.getElementById('search-results').style.display='none';
  document.getElementById('modal-client-name').textContent='👤 '+name;
  renderModalBody(name);
  document.getElementById('client-modal').classList.add('open');
}
function closeModal(){document.getElementById('client-modal').classList.remove('open');}
function closeModalOutside(e){if(e.target===document.getElementById('client-modal'))closeModal();}

function renderModalBody(name){
  const invs=load().filter(i=>i.client===name).sort((a,b)=>a.date.localeCompare(b.date));
  const totAmt=invs.reduce((s,i)=>s+i.amount,0);
  const totPaid=invs.reduce((s,i)=>s+(i.paid||0),0);
  const totDue=totAmt-totPaid;
  const overdueCount=invs.filter(isOverdue).length;
  const credit=getCredit(name);

  document.getElementById('modal-stats').innerHTML=`
    <div class="stat-card" style="cursor:default">
      <div class="stat-value" style="color:var(--accent-glow)">${invs.length}</div>
      <div class="stat-label">فواتير</div>
    </div>
    <div class="stat-card" style="cursor:default">
      <div class="stat-value" style="color:var(--success)">${fmt(totPaid)}</div>
      <div class="stat-label">محصّل (جنيه)</div>
    </div>
    <div class="stat-card" style="cursor:default">
      <div class="stat-value" style="color:${totDue>0?'var(--danger)':'var(--success)'}">${fmt(totDue)}</div>
      <div class="stat-label">متبقي (جنيه)</div>
    </div>
    ${credit>0?`<div class="stat-card" style="cursor:default;grid-column:1/-1">
      <div class="stat-value" style="color:var(--success);font-size:1.1rem">💳 ${fmt(credit)} جنيه</div>
      <div class="stat-label">رصيد دائن — يُخصم من الفاتورة القادمة</div>
    </div>`:''}`;

  if(!invs.length){document.getElementById('modal-body').innerHTML='<div class="empty"><div class="empty-icon">📂</div><div>لا توجد فواتير</div></div>';return;}

  const rows = invs.map(inv=>{
    const[cls,lbl]=statusLabel(inv);
    const dd=calcDueDate(inv.date,inv.dueOffset);
    const ov=isOverdue(inv);
    const paid=inv.paid||0;
    const rem=inv.amount-paid;
    const offset=inv.dueOffset||0;
    const colDates=(inv.collections||[]).map(c=>`${fmtDate(c.date)}: ${fmt(c.amount)} جنيه`).join(' | ');
    return`<tr>
      <td style="direction:ltr;text-align:right">${inv.number}</td>
      <td>${fmtDate(inv.date)}</td>
      <td style="color:${ov?'var(--danger)':'var(--accent-glow)'}">
        ${fmtDate(dd)}${ov?' ⚠️':''}
        ${offset>0?`<br><small style="color:var(--gold)">مؤجل +${offset} يوم</small>`:''}
      </td>
      <td>${fmt(inv.amount)}</td>
      <td>
        <div style="color:var(--success);font-weight:600">${fmt(paid)}</div>
        ${colDates?`<div class="col-dates">📅 ${colDates}</div>`:''}
      </td>
      <td style="color:var(--danger);font-weight:700">${fmt(rem)}</td>
      <td><span class="status status-${cls}">${lbl}</span></td>
    </tr>`;
  }).join('');

  document.getElementById('modal-body').innerHTML=`
    ${overdueCount>0?`<div class="overdue-alert">⚠️ ${overdueCount} فاتورة متأخرة التحصيل</div>`:''}
    <div class="table-wrap"><table>
      <thead><tr><th>رقم الفاتورة</th><th>تاريخ الفاتورة</th><th>موعد التحصيل</th><th>المبلغ</th><th>المدفوع</th><th>المتبقي</th><th>الحالة</th></tr></thead>
      <tbody>${rows}</tbody>
      <tfoot><tr>
        <td colspan="3" style="color:var(--text-muted);font-weight:700">الإجمالي</td>
        <td style="font-weight:700">${fmt(totAmt)}</td>
        <td style="color:var(--success);font-weight:700">${fmt(totPaid)}</td>
        <td style="color:var(--danger);font-weight:700">${fmt(totDue)}</td>
        <td></td>
      </tr></tfoot>
    </table></div>
    <div style="margin-top:14px;font-size:.75rem;color:var(--text-muted);text-align:center">محاسب الوفاء — ${fmtDate(todayStr())}</div>`;
}

// ── Client Excel
function exportClientExcel(){
  if(!modalClient)return;
  const invs=load().filter(i=>i.client===modalClient).sort((a,b)=>a.date.localeCompare(b.date));
  if(!invs.length)return showToast('لا توجد بيانات','error');
  const credit=getCredit(modalClient);
  const wb=XLSX.utils.book_new();
  const rows=[['رقم الفاتورة','تاريخ الفاتورة','موعد التحصيل','المبلغ','المدفوع','تواريخ التحصيل','المتبقي','الحالة']];
  invs.forEach(inv=>{
    const[,lbl]=statusLabel(inv);
    const colDates=(inv.collections||[]).map(c=>`${fmtDate(c.date)}: ${fmt(c.amount)}`).join(' | ');
    rows.push([inv.number,fmtDate(inv.date),fmtDate(calcDueDate(inv.date,0)),inv.amount,inv.paid||0,colDates,inv.amount-(inv.paid||0),lbl]);
  });
  const tA=invs.reduce((s,i)=>s+i.amount,0),tP=invs.reduce((s,i)=>s+(i.paid||0),0);
  rows.push(['','','الإجمالي',tA,tP,'',tA-tP,'']);
  if(credit>0){
    rows.push(['','','','','','','','']);
    rows.push(['💳 رصيد دائن','','',credit,'','','يُخصم من الفاتورة القادمة','']);
  }
  const ws=XLSX.utils.aoa_to_sheet(rows);
  ws['!cols']=[{wch:14},{wch:14},{wch:14},{wch:14},{wch:14},{wch:30},{wch:14},{wch:12}];
  XLSX.utils.book_append_sheet(wb,ws,modalClient.slice(0,30));
  XLSX.writeFile(wb,`تقرير_${modalClient}_${todayStr()}.xlsx`);
  showToast('✅ تم تحميل Excel');
}

// ── Client Screenshot
async function captureClientReport(){
  if(!modalClient)return;
  const invs=load().filter(i=>i.client===modalClient).sort((a,b)=>a.date.localeCompare(b.date));
  if(!invs.length)return showToast('لا توجد بيانات','error');
  const totAmt=invs.reduce((s,i)=>s+i.amount,0);
  const totPaid=invs.reduce((s,i)=>s+(i.paid||0),0);
  const totDue=totAmt-totPaid;

  // ══ Native Canvas — الوحيد الموثوق مع Arabic RTL ══
  {
  const credit=getCredit(modalClient);
  const W=1100, PX=36, ROW_H=52, ROW_H2=70 /* صف فيه تواريخ تحصيل */;
  const HEAD_H=200, STAT_H=80, FOOT_H=56;

  // احسب ارتفاع كل صف (بعض الفواتير فيها سطر تاني للتواريخ)
  const rowHeights=invs.map(inv=>(inv.collections&&inv.collections.length>0)?ROW_H2:ROW_H);
  const tableH=rowHeights.reduce((s,h)=>s+h,0);
  const H=HEAD_H+STAT_H+ROW_H+tableH+ROW_H+FOOT_H; // header+stats+thead+rows+tfoot+footer

  const canvas=document.createElement('canvas');
  canvas.width=W*2; canvas.height=H*2; // scale x2 for sharpness
  const ctx=canvas.getContext('2d');
  ctx.scale(2,2);

  // ── خلفية ──
  ctx.fillStyle='#1e2330'; ctx.fillRect(0,0,W,H);

  // ── Gradient Header ──
  const gr=ctx.createLinearGradient(0,0,W,0);
  gr.addColorStop(0,'#006666'); gr.addColorStop(1,'#023e8a');
  ctx.fillStyle=gr; roundRect(ctx,PX/2,PX/2,W-PX,HEAD_H-20,14); ctx.fill();

  ctx.direction='rtl'; ctx.textAlign='right';
  ctx.font='bold 28px Cairo,Arial'; ctx.fillStyle='#fff';
  ctx.fillText('👤 '+modalClient, W-PX, 60);
  ctx.font='15px Cairo,Arial'; ctx.fillStyle='rgba(255,255,255,.72)';
  ctx.fillText('فرع الوفاء — تاريخ التقرير: '+fmtDate(todayStr()), W-PX, 88);

  // ── Stats Cards ──
  const sw=(W-PX*2)/3;
  const statItems=[
    ['عدد الفواتير',''+invs.length,'#4ec9b0'],
    ['المحصّل (جنيه)',fmt(totPaid),'#00A63D'],
    ['المتبقي (جنيه)',fmt(totDue),'#FF2157']
  ];
  const sy=HEAD_H-10; const sh=STAT_H-10;
  statItems.forEach((st,i)=>{
    const sx=PX+i*(sw+6);
    ctx.fillStyle='#232a3b';
    roundRect(ctx,sx,sy,sw-6,sh,10); ctx.fill();
    ctx.font='bold 20px Cairo,Arial'; ctx.fillStyle=st[2]; ctx.textAlign='center';
    ctx.fillText(st[1], sx+(sw-6)/2, sy+28);
    ctx.font='11px Cairo,Arial'; ctx.fillStyle='#6c7a99';
    ctx.fillText(st[0], sx+(sw-6)/2, sy+48);
  });

  // ── Credit row (optional) ──
  let tableStartY=HEAD_H+STAT_H+8;
  if(credit>0){
    ctx.fillStyle='rgba(0,166,61,.12)';
    roundRect(ctx,PX,tableStartY,W-PX*2,34,8); ctx.fill();
    ctx.font='bold 13px Cairo,Arial'; ctx.fillStyle='#00A63D'; ctx.textAlign='right';
    ctx.fillText('💳 رصيد دائن: '+fmt(credit)+' جنيه — يُخصم من الفاتورة القادمة', W-PX*2, tableStartY+22);
    tableStartY+=42;
  }

  // ── Table Header ──
  const cols=['رقم الفاتورة','تاريخ الفاتورة','موعد التحصيل','المبلغ','المدفوع','المتبقي','الحالة'];
  const colW=(W-PX*2)/cols.length;
  ctx.fillStyle='#1a2030'; ctx.fillRect(0,tableStartY,W,ROW_H);
  ctx.font='bold 12px Cairo,Arial'; ctx.fillStyle='#6c7a99';
  ctx.textAlign='center'; ctx.direction='rtl';
  cols.forEach((c,i)=>ctx.fillText(c, W-PX-i*colW-colW/2, tableStartY+32));
  let y=tableStartY+ROW_H;

  // ── Table Rows ──
  invs.forEach((inv,ri)=>{
    const rh=rowHeights[ri];
    ctx.fillStyle=ri%2===0?'#1e2330':'#232a3b';
    ctx.fillRect(0,y,W,rh);

    const[,lbl]=statusLabel(inv);
    const dd=calcDueDate(inv.date,inv.dueOffset);
    const ov=isOverdue(inv);
    const colDates=(inv.collections||[]).map(c=>`${fmtDate(c.date)}: ${fmt(c.amount)}`).join('  |  ');

    const vals=[
      {t:inv.number,          c:'#cdd6f4'},
      {t:fmtDate(inv.date),   c:'#cdd6f4'},
      {t:fmtDate(dd)+(ov?' ⚠':'')+(inv.dueOffset>0?' +'+inv.dueOffset+'يوم':''), c:ov?'#FF2157':'#00b3b3'},
      {t:fmt(inv.amount),     c:'#cdd6f4'},
      {t:fmt(inv.paid||0),    c:'#00A63D'},
      {t:fmt(inv.amount-(inv.paid||0)), c:'#FF2157'},
      {t:lbl,                 c:lbl==='مسددة'?'#00A63D':lbl.includes('جزئ')?'#f39c12':'#FF2157'}
    ];

    ctx.font='13px Cairo,Arial'; ctx.textAlign='center'; ctx.direction='rtl';
    vals.forEach(({t,c},i)=>{
      ctx.fillStyle=c;
      // عمود المدفوع (index 4): لو فيه تواريخ نرفع المبلغ للسطر العلوي
      const lineY=(i===4&&colDates)?y+20:y+Math.round(rh/2)+5;
      ctx.fillText(t, W-PX-i*colW-colW/2, lineY);
    });

    // تاريخ التحصيل تحت المبلغ في نفس عمود المدفوع (col index 4)
    if(colDates){
      const cx=W-PX-4*colW-colW/2;
      ctx.font='10px Cairo,Arial'; ctx.fillStyle='#6c7a99';
      ctx.textAlign='center'; ctx.direction='rtl';
      let dTxt='📅 '+colDates;
      while(ctx.measureText(dTxt).width>colW-6&&dTxt.length>6) dTxt=dTxt.slice(0,-1);
      ctx.fillText(dTxt, cx, y+38);
    }
    y+=rh;
  });

  // ── Table Footer (totals) ──
  ctx.fillStyle='#1a2030'; ctx.fillRect(0,y,W,ROW_H);
  ctx.font='bold 13px Cairo,Arial';

  ctx.fillText(fmt(totPaid), W-PX-4*colW-colW/2, y+32);

  ctx.fillText(fmt(totDue), W-PX-5*colW-colW/2, y+32);

  ctx.fillStyle='#131720'; ctx.fillRect(0,y,W,FOOT_H);

  ctx.fillText('محاسب الوفاء — '+fmtDate(todayStr()), W/2, y+32);

  a.href=canvas.toDataURL('image/png'); a.click();
  showToast('✅ تم تحميل الصورة');
  }

function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();
}

function addInvoice(){
  const client=document.getElementById('inv-client').value.trim();
  const date=document.getElementById('inv-date').value;
  const amount=parseFloat(document.getElementById('inv-amount').value);
  const number=document.getElementById('inv-number').value.trim();

  if(!amount||amount<=0)return showToast('⚠️ أدخل مبلغاً صحيحاً','error');
  const data=load();
  const newInv={id:nextId(),client,date,amount,number:number||`INV-${data.length+1}`,paid:0,collections:[],createdAt:Date.now()};
  const credit=getCredit(client);
  if(credit>0){

function showClientBalance(){

  const invs=load().filter(i=>i.client===client&&(i.paid||0)<i.amount).sort((a,b)=>a.date.localeCompare(b.date));

    ${invs.length?`<div style="font-size:.82rem;color:var(--text-muted);margin-bottom:8px;font-weight:700">فواتير مفتوحة (${invs.length}) — متبقي: <span style="color:var(--danger)">${fmt(due)} جنيه</span></div>
    ${invs.map(i=>`<div class="client-row"><span>${fmtDate(i.date)} — ${i.number}</span><span style="color:var(--yellow)">${fmt(i.amount-(i.paid||0))} جنيه</span></div>`).join('')}`:''}
  </div>`;

function applyCollection(){
  const client=document.getElementById('col-client').value;
  let amount=parseFloat(document.getElementById('col-amount').value);
  const colDate=document.getElementById('col-date').value||todayStr();
  if(!client)return showToast('⚠️ اختر العميل','error');
  if(!amount||amount<=0)return showToast('⚠️ أدخل مبلغاً صحيحاً','error');
  let data=load();
  const existingCredit=getCredit(client);
  if(existingCredit>0){
    const usedCredit=Math.min(existingCredit,amount);
    useCredit(client,usedCredit);
    showToast(`💳 تم استخدام رصيد دائن: ${fmt(usedCredit)} جنيه`);
  }
  const unpaid=data.filter(i=>i.client===client&&(i.paid||0)<i.amount).sort((a,b)=>a.date.localeCompare(b.date));
  if(!unpaid.length){
    addCredit(client,amount,colDate);
    save(data);
    document.getElementById('col-amount').value='';
    populateClientSelect();updateBadges();renderInvStats();
    showToast(`💳 تم حفظ ${fmt(amount)} جنيه كرصيد دائن للعميل`);
    showClientBalance();
    return;
  }
  let rem=amount,touched=0;
  for(const inv of unpaid){
    if(rem<=0)break;
    const due=inv.amount-(inv.paid||0);const apply=Math.min(rem,due);
    const idx=data.findIndex(i=>i.id===inv.id);
    data[idx].paid=(data[idx].paid||0)+apply;
    data[idx].collections.push({date:colDate,amount:apply});
    rem-=apply;touched++;
  }
  if(rem>0){
    addCredit(client,rem,colDate);
    save(data);
    document.getElementById('col-amount').value='';
    populateClientSelect();updateBadges();renderInvStats();
    showToast(`✅ تم خصم ${fmt(amount-rem)} جنيه من ${touched} فاتورة`);
    setTimeout(()=>showToast(`💳 تم حفظ الزيادة ${fmt(rem)} جنيه كرصيد دائن للعميل`),1200);
  }else{
    save(data);
    document.getElementById('col-amount').value='';
    populateClientSelect();updateBadges();renderInvStats();
    showToast(`✅ تم خصم ${fmt(amount)} جنيه من ${touched} فاتورة`);
  }
  showClientBalance();
}

let ppInvId='';
let ppMode='days';

function openPostpone(id){
  const data=load();
  const inv=data.find(i=>i.id===id);
  if(!inv)return;
  ppInvId=id;ppMode='days';
  const currentDue=calcDueDate(inv.date,inv.dueOffset);
  document.getElementById('pp-client-lbl').textContent=`${inv.client} — ${inv.number}`;
  document.getElementById('pp-current-due').textContent=fmtDate(currentDue);
  document.getElementById('pp-new-due').textContent='—';
  document.getElementById('pp-days-input').value='';
  document.getElementById('pp-date-input').value='';
  document.querySelectorAll('.p-tab').forEach((t,i)=>{t.classList.toggle('active',i===0);});
  document.getElementById('pp-days-section').classList.add('open');
  document.getElementById('pp-date-section').classList.remove('open');
  document.getElementById('postpone-overlay').classList.add('open');
}

function closePostpone(){document.getElementById('postpone-overlay').classList.remove('open');ppInvId='';}
function closePostponeOutside(e){if(e.target===document.getElementById('postpone-overlay'))closePostpone();}

function switchPTab(mode,btn){
  ppMode=mode;
  document.querySelectorAll('.p-tab').forEach(t=>t.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('pp-days-section').classList.toggle('open',mode==='days');
  document.getElementById('pp-date-section').classList.toggle('open',mode==='date');
  document.getElementById('pp-new-due').textContent='—';
}

function setDays(n){
  document.getElementById('pp-days-input').value=n;
  previewNewDue();
}

function previewNewDue(){
  if(!ppInvId)return;
  const data=load();
  const inv=data.find(i=>i.id===ppInvId);
  if(!inv)return;
  const currentOffset=inv.dueOffset||0;
  let newDue='';
  if(ppMode==='days'){
    const d=parseInt(document.getElementById('pp-days-input').value);
    if(d>0)newDue=calcDueDate(inv.date,currentOffset+d);
  }else{
    newDue=document.getElementById('pp-date-input').value;
  }
  document.getElementById('pp-new-due').textContent=newDue?fmtDate(newDue):'—';
}

document.addEventListener('input',e=>{
  if(e.target.id==='pp-days-input'||e.target.id==='pp-date-input')previewNewDue();
});

function applyPostpone(){
  if(!ppInvId)return;
  let data=load();
  const idx=data.findIndex(i=>i.id===ppInvId);
  if(idx===-1)return;
  const inv=data[idx];
  const currentOffset=inv.dueOffset||0;
  if(ppMode==='days'){
    const d=parseInt(document.getElementById('pp-days-input').value);
    if(!d||d<=0)return showToast('⚠️ أدخل عدد أيام صحيح','error');
    data[idx].dueOffset=(currentOffset+d);
    const newDue=calcDueDate(inv.date,data[idx].dueOffset);
    save(data);closePostpone();renderReport();updateBadges();
    showToast(`✅ تم التأجيل — موعد التحصيل الجديد: ${fmtDate(newDue)}`);
  }else{
    const newDate=document.getElementById('pp-date-input').value;
    if(!newDate)return showToast('⚠️ اختر تاريخاً','error');
    if(newDate<=todayStr())return showToast('⚠️ التاريخ يجب أن يكون بعد اليوم','error');
    const baseDue=calcDueDate(inv.date,0);
    const diffMs=new Date(newDate)-new Date(baseDue);
    const diffDays=Math.round(diffMs/864e5);
    data[idx].dueOffset=diffDays;
    save(data);closePostpone();renderReport();updateBadges();
    showToast(`✅ تم التأجيل — موعد التحصيل الجديد: ${fmtDate(newDate)}`);
  }
}

  if(!all.length)return showToast('لا توجد بيانات','error');
  const wb=XLSX.utils.book_new();
  const rows=[['م','النوع','العميل','رقم الفاتورة','تاريخ الفاتورة','موعد التحصيل','المبلغ الكلي','المدفوع','المتبقي','الحالة']];
  all.forEach((inv,i)=>{
    const[,lbl]=statusLabel(inv);
    rows.push([i+1,inv._type,inv.client,inv.number,fmtDate(inv.date),fmtDate(calcDueDate(inv.date,0)),inv.amount,inv.paid||0,inv.amount-(inv.paid||0),lbl]);
  });
  const tot=all.reduce((s,i)=>s+(i.amount-(i.paid||0)),0);
  rows.push(['','','','','','الإجمالي','','',tot,'']);
  const ws=XLSX.utils.aoa_to_sheet(rows);
  ws['!cols']=[{wch:4},{wch:8},{wch:18},{wch:12},{wch:14},{wch:14},{wch:14},{wch:14},{wch:14},{wch:12}];
  XLSX.utils.book_append_sheet(wb,ws,'التقرير اليومي');
  XLSX.writeFile(wb,`تقرير_يومي_${today}.xlsx`);
  showToast('✅ تم تحميل Excel');
}

function captureReport(){
  const today=todayStr();
  const selDate=document.getElementById('report-date-filter').value||today;
  const isToday=selDate===today;
  const data=load();

  const todayInvs=data.filter(i=>calcDueDate(i.date,i.dueOffset)===selDate&&(i.paid||0)<i.amount).map(i=>({...i,_type:'today'}));
  const overdueInvs=isToday
    ? data.filter(i=>calcDueDate(i.date,i.dueOffset)<today&&(i.paid||0)<i.amount).map(i=>({...i,_type:'overdue'}))
    : [];
  const all=[...overdueInvs,...todayInvs].sort((a,b)=>a.date.localeCompare(b.date));
  if(!all.length)return showToast('لا توجد بيانات للتصدير','error');

  const totToday =todayInvs.reduce((s,i)=>s+(i.amount-(i.paid||0)),0);
  const totOverdue=overdueInvs.reduce((s,i)=>s+(i.amount-(i.paid||0)),0);
  const totAll   =totToday+totOverdue;

  /* ── Pure Canvas ── */
  const SC=2, W=1200, PX=36;
  const HDR_H =90;
  const SUMM_H=overdueInvs.length>0?70:0; // شريط إجماليات
  const TH_H  =46;
  const ROW_H =50;
  const FOOT_H=56;
  const H=HDR_H+SUMM_H+TH_H+all.length*ROW_H+ROW_H+FOOT_H+10;

  const canvas=document.createElement('canvas');
  canvas.width=W*SC; canvas.height=H*SC;
  const ctx=canvas.getContext('2d');
  ctx.scale(SC,SC);

  /* helpers */
  function rrFill(x,y,w,h,r,fill){
    ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);
    ctx.quadraticCurveTo(x+w,y,x+w,y+r);ctx.lineTo(x+w,y+h-r);
    ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);
    ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);
    ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();
    ctx.fillStyle=fill;ctx.fill();
  }
  function clip(txt,maxPx){
    while(ctx.measureText(txt).width>maxPx&&txt.length>3)txt=txt.slice(0,-1);
    return txt;
  }

  /* ── خلفية */
  ctx.fillStyle='#1e2330'; ctx.fillRect(0,0,W,H);

  /* ── HEADER gradient */
  const gr=ctx.createLinearGradient(0,0,W,0);
  gr.addColorStop(0,'#006666'); gr.addColorStop(1,'#023e8a');
  ctx.fillStyle=gr; ctx.fillRect(0,0,W,HDR_H-8);
  ctx.direction='rtl'; ctx.textAlign='right';
  ctx.font='bold 26px Cairo,Arial'; ctx.fillStyle='#fff';
  ctx.fillText('📋 تحصيلات اليوم — فرع الوفاء', W-PX, 40);
  ctx.font='14px Cairo,Arial'; ctx.fillStyle='rgba(255,255,255,.75)';
  ctx.fillText('تاريخ التقرير: '+fmtDate(selDate)+'   |   اليوم: '+todayInvs.length+'   متأخرة: '+overdueInvs.length, W-PX, 66);

  let cy=HDR_H;

  /* ── SUMMARY BAR (لو فيه متأخرات) */
  if(overdueInvs.length>0){
    const bw=Math.floor((W-PX*2-20)/3);
    const items=[
      ['📅 مطلوب اليوم',fmt(totToday),'#00b3b3'],
      ['⚠️ متأخر',fmt(totOverdue),'#FF2157'],
      ['💰 الإجمالي',fmt(totAll),'#f4a261'],
    ];
    items.forEach((it,i)=>{
      const bx=PX+i*(bw+10), by=cy+6;
      rrFill(bx,by,bw,SUMM_H-12,10,'#232a3b');
      ctx.font='bold 18px Cairo,Arial'; ctx.fillStyle=it[2]; ctx.textAlign='center'; ctx.direction='ltr';
      ctx.fillText(it[1], bx+bw/2, by+30);
      ctx.font='11px Cairo,Arial'; ctx.fillStyle='#6c7a99';
      ctx.fillText(it[0], bx+bw/2, by+50);
    });
    cy+=SUMM_H;
  }

  /* ── COLS تعريف */
  const colDefs=[
    {lbl:'#',              fr:0.04},
    {lbl:'النوع',          fr:0.09},
    {lbl:'العميل',         fr:0.14},
    {lbl:'رقم الفاتورة',  fr:0.11},
    {lbl:'تاريخ الفاتورة',fr:0.11},
    {lbl:'موعد التحصيل',  fr:0.12},
    {lbl:'المتبقي',        fr:0.11},
    {lbl:'الحالة',         fr:0.15},
    {lbl:'',               fr:0.13}, // فراغ آخر
  ];
  const TW=W-PX*2;
  function colCX(i){ return W-PX-colDefs.slice(0,i).reduce((s,c)=>s+c.fr*TW,0)-colDefs[i].fr*TW/2; }
  function colMaxW(i){ return colDefs[i].fr*TW-8; }

  /* ── TABLE HEADER */
  ctx.fillStyle='#1a2030'; ctx.fillRect(PX,cy,TW,TH_H);
  ctx.font='bold 11px Cairo,Arial'; ctx.fillStyle='#6c7a99';
  ctx.textAlign='center'; ctx.direction='rtl';
  colDefs.forEach((c,i)=>{ if(c.lbl) ctx.fillText(c.lbl, colCX(i), cy+29); });
  ctx.strokeStyle='#2a3044'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(PX,cy+TH_H); ctx.lineTo(W-PX,cy+TH_H); ctx.stroke();
  cy+=TH_H;

  /* ── TABLE ROWS */
  const sColor={paid:'#00A63D',partial:'#f39c12',unpaid:'#FF2157'};
  all.forEach((inv,ri)=>{
    const[cls,lbl]=statusLabel(inv);
    const dd=calcDueDate(inv.date,inv.dueOffset);
    const isOv=inv._type==='overdue';
    const daysLate=isOv?Math.floor((new Date(today)-new Date(dd))/864e5):0;
    const rem=inv.amount-(inv.paid||0);

    ctx.fillStyle=isOv?'rgba(255,33,87,.05)':(ri%2===0?'#1e2330':'#232a3b');
    ctx.fillRect(PX,cy,TW,ROW_H);

    const cells=[
      {t:''+(ri+1),          c:'#6c7a99'},
      {t:isOv?'⚠️ متأخر\n'+daysLate+'يوم':'📅 اليوم', c:isOv?'#FF2157':'#00b3b3'},
      {t:inv.client,         c:'#00b3b3'},
      {t:inv.number,         c:'#cdd6f4'},
      {t:fmtDate(inv.date),  c:'#cdd6f4'},
      {t:fmtDate(dd)+((inv.dueOffset||0)>0?' +'+inv.dueOffset+'د':''), c:isOv?'#FF2157':'#00b3b3'},
      {t:fmt(rem),           c:isOv?'#FF2157':'#cdd6f4'},
      {t:lbl,                c:sColor[cls]},
      {t:'',                 c:'#cdd6f4'},
    ];

    ctx.font='12px Cairo,Arial'; ctx.textAlign='center'; ctx.direction='rtl';
    cells.forEach((cell,i)=>{
      ctx.fillStyle=cell.c;
      // النوع: نعمله سطرين
      if(i===1&&isOv){
        ctx.font='11px Cairo,Arial';
        ctx.fillText('⚠️ متأخر', colCX(i), cy+ROW_H/2);
        ctx.fillStyle='#ff8a8a';
        ctx.fillText(daysLate+' يوم', colCX(i), cy+ROW_H/2+14);
        ctx.font='12px Cairo,Arial';
      } else {
        const txt=clip(cell.t, colMaxW(i));
        ctx.fillText(txt, colCX(i), cy+ROW_H/2+5);
      }
    });

    ctx.strokeStyle='#2a3044'; ctx.lineWidth=.5;
    ctx.beginPath(); ctx.moveTo(PX,cy+ROW_H); ctx.lineTo(W-PX,cy+ROW_H); ctx.stroke();
    cy+=ROW_H;
  });

  /* ── TOTALS ROW */
  ctx.fillStyle='#1a2030'; ctx.fillRect(PX,cy,TW,ROW_H);
  ctx.font='bold 13px Cairo,Arial'; ctx.textAlign='center'; ctx.direction='rtl';
  ctx.fillStyle='#6c7a99'; ctx.fillText('الإجمالي الكلي المطلوب', colCX(2), cy+ROW_H/2+5);
  ctx.fillStyle='#f4a261';  ctx.fillText(fmt(totAll), colCX(6), cy+ROW_H/2+5);
  cy+=ROW_H;

  /* ── FOOTER */
  ctx.fillStyle='#131720'; ctx.fillRect(0,cy,W,FOOT_H+10);
  ctx.font='12px Cairo,Arial'; ctx.fillStyle='#6c7a99';
  ctx.textAlign='center'; ctx.direction='ltr';
  ctx.fillText('محاسب الوفاء  —  '+fmtDate(today), W/2, cy+30);

  /* ── تحميل */
  const a=document.createElement('a');
  a.download=`تقرير_يومي_${selDate}.png`;
  a.href=canvas.toDataURL('image/png'); a.click();
  showToast('✅ تم تحميل الصورة');
}

// ═══ ALL — CHECKBOX FILTER ═══
function onChkAll(){
  const all=document.getElementById('chk-all').checked;
  ['unpaid','partial','paid'].forEach(k=>document.getElementById('chk-'+k).checked=false);
  if(!all)document.getElementById('chk-all').checked=true;
  updateChkStyles();renderAll();
}
function onChkFilter(){
  document.getElementById('chk-all').checked=false;
  const any=['unpaid','partial','paid'].some(k=>document.getElementById('chk-'+k).checked);
  if(!any)document.getElementById('chk-all').checked=true;
  updateChkStyles();renderAll();
}
function updateChkStyles(){
  const map={all:'checked-all',unpaid:'checked-unpaid',partial:'checked-partial',paid:'checked-paid'};
  Object.entries(map).forEach(([k,cls])=>{
    const lbl=document.getElementById('chk-lbl-'+k);
    lbl.classList.toggle(cls,document.getElementById('chk-'+k).checked);
  });
}
function getActiveFilters(){
  if(document.getElementById('chk-all').checked)return['unpaid','partial','paid'];
  return['unpaid','partial','paid'].filter(k=>document.getElementById('chk-'+k).checked);
}

function renderAll(){
  const filters=getActiveFilters();
  let data=load().sort((a,b)=>b.date.localeCompare(a.date));
  data=data.filter(inv=>{
    const p=inv.paid||0;
    if(p<=0&&filters.includes('unpaid'))return true;
    if(p>=inv.amount&&filters.includes('paid'))return true;
    if(p>0&&p<inv.amount&&filters.includes('partial'))return true;
    return false;
  });
  const body=document.getElementById('all-invoices-body');
  if(!data.length){body.innerHTML='<div class="empty"><div class="empty-icon">📂</div><div>لا توجد فواتير</div></div>';return;}
  body.innerHTML=`<div class="table-wrap"><table>
    <thead><tr><th>العميل</th><th>التاريخ</th><th>موعد التحصيل</th><th>المبلغ</th><th>المدفوع</th><th>الحالة</th><th></th></tr></thead>
    <tbody>${data.map(inv=>{
      const[cls,lbl]=statusLabel(inv);const dd=calcDueDate(inv.date,inv.dueOffset);const ov=isOverdue(inv);const offset=inv.dueOffset||0;
      return`<tr>
        <td><strong style="cursor:pointer;color:var(--accent-glow)" onclick="openClientModal('${esc(inv.client)}')">${inv.client}</strong><br><small style="color:var(--text-muted)">${inv.number}</small></td>
        <td>${fmtDate(inv.date)}</td>
        <td style="color:${ov?'var(--danger)':'var(--accent-glow)'}">
          ${fmtDate(dd)}${ov?' ⚠️':''}
          ${offset>0?`<br><small style="color:var(--gold)">مؤجل +${offset}يوم</small>`:''}
        </td>
        <td>${fmt(inv.amount)}</td>
        <td style="color:var(--success)">${fmt(inv.paid||0)}</td>
        <td><span class="status status-${cls}">${lbl}</span></td>
        <td><button class="btn btn-sm btn-danger" onclick="deleteInvoice('${inv.id}')">🗑</button></td>
      </tr>`;}).join('')}
    </tbody></table></div>`;
}

function deleteInvoice(id){if(!confirm('حذف هذه الفاتورة؟'))return;save(load().filter(i=>i.id!==id));renderAll();updateBadges();showToast('تم الحذف');}
function clearAllData(){if(!confirm('⚠️ سيتم مسح جميع البيانات. هل أنت متأكد؟'))return;localStorage.removeItem(SK);localStorage.removeItem(CK);localStorage.removeItem(CK+'_log');renderAll();renderInvStats();updateBadges();showToast('تم مسح البيانات');}

// ═══ BADGES ═══
function updateBadges(){
  const today=todayStr(),data=load();
  const dc=data.filter(i=>calcDueDate(i.date,i.dueOffset)===today&&(i.paid||0)<i.amount).length;
  const oc=data.filter(isOverdue).length;
  const rb=document.getElementById('report-badge');
  const total=dc+oc;
  rb.textContent=total;rb.classList.toggle('show',total>0);
}

// ═══ INIT ═══
function init(){
  const today=new Date();
  document.getElementById('hdr-date').textContent=today.toLocaleDateString('ar-EG',{weekday:'long',year:'numeric',month:'long',day:'numeric'});
  document.getElementById('inv-date').value=todayStr();
  document.getElementById('col-date').value=todayStr();
  document.getElementById('report-date-filter').value=todayStr();
  updateBadges();renderInvStats();updateDatalist();updateChkStyles();
}
init();
</script>
